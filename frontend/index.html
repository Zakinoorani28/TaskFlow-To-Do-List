<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple To-Do List — SHU PF Project</title>
    <style>
      /* ── RESET ── */
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Segoe UI", sans-serif;
        background: #0f0f13;
        color: #e8e8f0;
        min-height: 100vh;
        padding: 2rem 1rem 4rem;
      }

      /* ── SOFT GLOW BACKGROUND ── */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: 0;
        background:
          radial-gradient(
            ellipse 70% 50% at 30% 20%,
            rgba(99, 102, 241, 0.1) 0%,
            transparent 70%
          ),
          radial-gradient(
            ellipse 50% 60% at 80% 80%,
            rgba(34, 197, 94, 0.06) 0%,
            transparent 70%
          );
        pointer-events: none;
      }

      .wrap {
        position: relative;
        z-index: 1;
        max-width: 700px;
        margin: 0 auto;
      }

      /* ── HEADER ── */
      .header {
        text-align: center;
        margin-bottom: 2rem;
      }
      .header h1 {
        font-size: 2rem;
        font-weight: 700;
        background: linear-gradient(135deg, #818cf8, #6ee7b7);
        background-clip: text;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        letter-spacing: -0.02em;
      }
      .header p {
        color: rgba(232, 232, 240, 0.45);
        font-size: 0.85rem;
        margin-top: 0.4rem;
      }

      /* ── STATS ROW ── */
      .stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 0.75rem;
        margin-bottom: 1.75rem;
      }
      .stat {
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 12px;
        padding: 1rem;
        text-align: center;
      }
      .stat-num {
        font-size: 1.8rem;
        font-weight: 700;
        display: block;
      }
      .stat-label {
        font-size: 0.72rem;
        color: rgba(232, 232, 240, 0.45);
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      .s-total .stat-num {
        color: #818cf8;
      }
      .s-done .stat-num {
        color: #6ee7b7;
      }
      .s-left .stat-num {
        color: #fbbf24;
      }

      /* ── ADD TASK FORM ── */
      .add-box {
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 14px;
        padding: 1.25rem;
        margin-bottom: 1.25rem;
        transition: border-color 0.2s;
      }
      .add-box:focus-within {
        border-color: rgba(129, 140, 248, 0.5);
      }

      .add-box input[type="text"] {
        width: 100%;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 8px;
        color: #e8e8f0;
        font-size: 0.95rem;
        padding: 0.7rem 1rem;
        outline: none;
        margin-bottom: 0.75rem;
        transition: border-color 0.2s;
      }
      .add-box input[type="text"]:focus {
        border-color: #818cf8;
      }
      .add-box input[type="text"]::placeholder {
        color: rgba(232, 232, 240, 0.3);
      }

      .form-row {
        display: flex;
        gap: 0.65rem;
        align-items: center;
      }

      .add-box select {
        flex: 1;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 8px;
        color: #e8e8f0;
        font-size: 0.82rem;
        padding: 0.6rem 0.8rem;
        outline: none;
        cursor: pointer;
      }
      .add-box select option {
        background: #1a1a24;
      }

      .btn-add {
        background: linear-gradient(135deg, #818cf8, #6ee7b7);
        border: none;
        border-radius: 8px;
        color: #0f0f13;
        cursor: pointer;
        font-size: 0.88rem;
        font-weight: 700;
        padding: 0.65rem 1.4rem;
        white-space: nowrap;
        transition:
          opacity 0.2s,
          transform 0.15s;
      }
      .btn-add:hover {
        opacity: 0.88;
        transform: translateY(-1px);
      }
      .btn-add:active {
        transform: scale(0.97);
      }

      /* ── FILTER TABS ── */
      .filters {
        display: flex;
        gap: 0.5rem;
        margin-bottom: 1rem;
        flex-wrap: wrap;
      }
      .f-btn {
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 100px;
        color: rgba(232, 232, 240, 0.5);
        cursor: pointer;
        font-size: 0.8rem;
        padding: 0.4rem 0.9rem;
        transition: all 0.2s;
      }
      .f-btn:hover {
        color: #e8e8f0;
      }
      .f-btn.on {
        background: rgba(129, 140, 248, 0.15);
        border-color: rgba(129, 140, 248, 0.5);
        color: #a5b4fc;
      }

      /* ── TASK CARDS ── */
      #list {
        display: flex;
        flex-direction: column;
        gap: 0.55rem;
      }

      .card {
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-left: 3px solid var(--pc, #818cf8);
        border-radius: 10px;
        padding: 0.9rem 1rem;
        display: flex;
        align-items: center;
        gap: 0.85rem;
        animation: fadeIn 0.25s ease;
        transition: opacity 0.2s;
      }
      .card:hover {
        border-color: rgba(255, 255, 255, 0.15);
      }
      .card.done {
        opacity: 0.45;
      }

      /* Custom checkbox */
      .card input[type="checkbox"] {
        display: none;
      }
      .chk {
        width: 20px;
        height: 20px;
        flex-shrink: 0;
        border: 2px solid var(--pc, #818cf8);
        border-radius: 5px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s;
        font-size: 12px;
        font-weight: 700;
        color: transparent;
      }
      .card.done .chk {
        background: var(--pc, #818cf8);
        color: white;
      }

      .card-body {
        flex: 1;
        min-width: 0;
      }
      .card-title {
        font-size: 0.92rem;
        font-weight: 500;
        transition: all 0.2s;
        word-break: break-word;
      }
      .card.done .card-title {
        text-decoration: line-through;
      }

      .card-meta {
        display: flex;
        gap: 0.4rem;
        margin-top: 0.35rem;
        flex-wrap: wrap;
      }
      .badge {
        font-size: 0.68rem;
        font-weight: 600;
        padding: 0.18rem 0.55rem;
        border-radius: 100px;
        letter-spacing: 0.04em;
      }
      .p-High {
        background: rgba(239, 68, 68, 0.15);
        color: #fca5a5;
      }
      .p-Medium {
        background: rgba(251, 191, 36, 0.15);
        color: #fde68a;
      }
      .p-Low {
        background: rgba(110, 231, 183, 0.15);
        color: #6ee7b7;
      }
      .c-Study {
        background: rgba(129, 140, 248, 0.15);
        color: #a5b4fc;
      }
      .c-Work {
        background: rgba(56, 189, 248, 0.15);
        color: #7dd3fc;
      }
      .c-Personal {
        background: rgba(251, 146, 60, 0.15);
        color: #fdba74;
      }

      .del-btn {
        background: none;
        border: 1px solid transparent;
        border-radius: 6px;
        color: rgba(232, 232, 240, 0.25);
        cursor: pointer;
        font-size: 1rem;
        width: 28px;
        height: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s;
        flex-shrink: 0;
      }
      .card:hover .del-btn {
        color: rgba(239, 68, 68, 0.6);
        border-color: rgba(239, 68, 68, 0.2);
      }
      .del-btn:hover {
        background: rgba(239, 68, 68, 0.1) !important;
        color: #f87171 !important;
      }

      /* ── EMPTY STATE ── */
      .empty {
        text-align: center;
        padding: 3rem 1rem;
        color: rgba(232, 232, 240, 0.3);
        display: none;
      }
      .empty.show {
        display: block;
      }
      .empty-icon {
        font-size: 2.5rem;
        margin-bottom: 0.75rem;
      }
      .empty-text {
        font-size: 0.9rem;
      }

      /* ── FOOTER NOTE ── */
      .footer {
        text-align: center;
        margin-top: 2.5rem;
        font-size: 0.75rem;
        color: rgba(232, 232, 240, 0.2);
        line-height: 1.8;
      }

      /* ── ANIMATION ── */
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <!-- HEADER -->
      <div class="header">
        <h1>📝 Simple To-Do List</h1>
        <p>
          Salim Habib University &nbsp;·&nbsp; Programming Fundamentals
          &nbsp;·&nbsp; Final Project
        </p>
      </div>

      <!-- STATS -->
      <div class="stats">
        <div class="stat s-total">
          <span class="stat-num" id="s-total">0</span>
          <span class="stat-label">Total</span>
        </div>
        <div class="stat s-done">
          <span class="stat-num" id="s-done">0</span>
          <span class="stat-label">Done</span>
        </div>
        <div class="stat s-left">
          <span class="stat-num" id="s-left">0</span>
          <span class="stat-label">Remaining</span>
        </div>
      </div>

      <!-- ADD TASK FORM -->
      <div class="add-box">
        <input
          type="text"
          id="title"
          placeholder="What needs to be done?"
          maxlength="100"
        />
        <div class="form-row">
          <select id="priority">
            <option value="High">🔴 High Priority</option>
            <option value="Medium" selected>🟡 Medium Priority</option>
            <option value="Low">🟢 Low Priority</option>
          </select>
          <select id="category">
            <option value="Study">📚 Study</option>
            <option value="Work">💼 Work</option>
            <option value="Personal">🏠 Personal</option>
          </select>
          <button class="btn-add" onclick="addTask()">+ Add</button>
        </div>
      </div>

      <!-- FILTER TABS -->
      <div class="filters">
        <button class="f-btn on" onclick="setFilter('all', this)">All</button>
        <button class="f-btn" onclick="setFilter('pending', this)">
          Pending
        </button>
        <button class="f-btn" onclick="setFilter('done', this)">Done</button>
        <button class="f-btn" onclick="setFilter('Study', this)">
          📚 Study
        </button>
        <button class="f-btn" onclick="setFilter('Work', this)">💼 Work</button>
        <button class="f-btn" onclick="setFilter('Personal', this)">
          🏠 Personal
        </button>
      </div>

      <!-- TASK LIST -->
      <div id="list"></div>

      <!-- EMPTY STATE -->
      <div class="empty" id="empty">
        <div class="empty-icon">✅</div>
        <div class="empty-text">No tasks here. Add one above!</div>
      </div>

      <!-- FOOTER -->
      <div class="footer">
        Tasks saved in browser storage &nbsp;·&nbsp; C++ backend uses structs,
        arrays, UDFs, file I/O<br />
        PF Final Project &nbsp;·&nbsp; Salim Habib University
      </div>
    </div>

    <script>
      // ── DATA ──────────────────────────────────────────────
      // Load tasks from browser storage (like C++ loads from file)
      let tasks = JSON.parse(localStorage.getItem("pf-tasks") || "[]");
      let nextId = parseInt(localStorage.getItem("pf-nextid") || "1");
      let filter = "all";

      // ── SAVE ─────────────────────────────────────────────
      // Like saveTasks() in C++ — persist to storage
      function save() {
        localStorage.setItem("pf-tasks", JSON.stringify(tasks));
        localStorage.setItem("pf-nextid", nextId);
      }

      // ── ADD TASK ──────────────────────────────────────────
      // Mirrors addTask() UDF in C++
      function addTask() {
        const title = document.getElementById("title").value.trim();
        if (!title) {
          document.getElementById("title").focus();
          return;
        }

        // Create a task object (like filling a C++ struct)
        const task = {
          id: nextId++,
          title: title,
          priority: document.getElementById("priority").value,
          category: document.getElementById("category").value,
          completed: false,
        };

        tasks.push(task); // Add to array
        save();
        render();

        document.getElementById("title").value = "";
        document.getElementById("title").focus();
      }

      // ── TOGGLE DONE ───────────────────────────────────────
      // Mirrors markDone() UDF in C++
      function toggleDone(id) {
        // Loop to find matching ID — same as C++ for loop search
        for (let i = 0; i < tasks.length; i++) {
          if (tasks[i].id === id) {
            tasks[i].completed = !tasks[i].completed;
            break;
          }
        }
        save();
        render();
      }

      // ── DELETE TASK ───────────────────────────────────────
      // Mirrors deleteTask() UDF in C++
      function deleteTask(id) {
        tasks = tasks.filter((t) => t.id !== id);
        save();
        render();
      }

      // ── FILTER ────────────────────────────────────────────
      function setFilter(f, btn) {
        filter = f;
        document
          .querySelectorAll(".f-btn")
          .forEach((b) => b.classList.remove("on"));
        btn.classList.add("on");
        render();
      }

      // ── RENDER ────────────────────────────────────────────
      // Builds the task list on screen — like viewAllTasks() in C++
      function render() {
        // Priority → border color map
        const priColor = { High: "#fca5a5", Medium: "#fde68a", Low: "#6ee7b7" };

        // Filter tasks based on current tab
        let visible = tasks.filter((t) => {
          if (filter === "pending") return !t.completed;
          if (filter === "done") return t.completed;
          if (filter === "Study" || filter === "Work" || filter === "Personal")
            return t.category === filter;
          return true; // 'all'
        });

        const list = document.getElementById("list");
        const empty = document.getElementById("empty");

        // Show empty state if nothing to display
        if (visible.length === 0) {
          list.innerHTML = "";
          empty.classList.add("show");
        } else {
          empty.classList.remove("show");

          // Build HTML for each task card
          list.innerHTML = visible
            .map(
              (t) => `
      <div class="card ${t.completed ? "done" : ""}"
           style="--pc: ${priColor[t.priority] || "#818cf8"}">
        <div class="chk" onclick="toggleDone(${t.id})">
          ${t.completed ? "✓" : ""}
        </div>
        <div class="card-body">
          <div class="card-title">${esc(t.title)}</div>
          <div class="card-meta">
            <span class="badge p-${t.priority}">${t.priority}</span>
            <span class="badge c-${t.category}">${t.category}</span>
          </div>
        </div>
        <button class="del-btn" onclick="deleteTask(${t.id})" title="Delete">✕</button>
      </div>
    `,
            )
            .join("");
        }

        // Update stats
        const done = tasks.filter((t) => t.completed).length;
        document.getElementById("s-total").textContent = tasks.length;
        document.getElementById("s-done").textContent = done;
        document.getElementById("s-left").textContent = tasks.length - done;
      }

      // ── UTILITY ───────────────────────────────────────────
      // Escape HTML for safety (like escapeString in C++)
      function esc(str) {
        return str
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }

      // Enter key to add task
      document.getElementById("title").addEventListener("keydown", (e) => {
        if (e.key === "Enter") addTask();
      });

      // Initial render on page load
      render();
    </script>
  </body>
</html>
