<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaskFlow Smart To-Do List - SHU PF Project</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="wrap">
      <!-- Header -->
      <div class="header">
        <h1>Simple To-Do List</h1>
        <p>
          Salim Habib University &middot; Programming Fundamentals &middot;
          Final Project
        </p>
      </div>

      <!-- Stats -->
      <div class="stats">
        <div class="stat s-total">
          <span class="stat-num" id="s-total">0</span>
          <span class="stat-label">Total</span>
        </div>
        <div class="stat s-done">
          <span class="stat-num" id="s-done">0</span>
          <span class="stat-label">Done</span>
        </div>
        <div class="stat s-left">
          <span class="stat-num" id="s-left">0</span>
          <span class="stat-label">Remaining</span>
        </div>
      </div>

      <!-- Add task form -->
      <div class="add-box">
        <input
          type="text"
          id="title"
          placeholder="What needs to be done?"
          maxlength="100"
        />
        <div class="form-row">
          <select id="priority">
            <option value="High">High Priority</option>
            <option value="Medium" selected>Medium Priority</option>
            <option value="Low">Low Priority</option>
          </select>
          <select id="category">
            <option value="Study">Study</option>
            <option value="Work">Work</option>
            <option value="Personal">Personal</option>
          </select>
          <button class="btn-add" onclick="addTask()">+ Add</button>
        </div>
      </div>

      <!-- Filter tabs -->
      <div class="filters">
        <button class="f-btn on" onclick="setFilter('all', this)">All</button>
        <button class="f-btn" onclick="setFilter('pending', this)">
          Pending
        </button>
        <button class="f-btn" onclick="setFilter('done', this)">Done</button>
        <button class="f-btn" onclick="setFilter('Study', this)">Study</button>
        <button class="f-btn" onclick="setFilter('Work', this)">Work</button>
        <button class="f-btn" onclick="setFilter('Personal', this)">
          Personal
        </button>
      </div>

      <!-- Task list -->
      <div id="list"></div>

      <!-- Empty state -->
      <div class="empty" id="empty">
        <div class="empty-icon">&#10003;</div>
        <div class="empty-text">No tasks here. Add one above!</div>
      </div>

      <!-- Footer -->
      <div class="footer">
        Tasks saved in browser storage &middot; C++ backend uses structs,
        arrays, UDFs, file I/O<br />
        PF Final Project &middot; Salim Habib University
      </div>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
